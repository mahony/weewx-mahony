# Host-aware access log for the weather site, used by visitors/visitors.py.
# Install as /etc/nginx/conf.d/wx_log.conf (http context), then add
#     access_log /var/log/nginx/wx_access.log wx;
# inside the server { } blocks for wx.nerpy.co and wx.mahony.me
# (sites-enabled/wx-nerpy, sites-enabled/wx-mahony). The stock logrotate config
# already rotates /var/log/nginx/*.log. Test with `sudo nginx -t`, apply with
# `sudo systemctl reload nginx`.
log_format wx '$host $remote_addr - - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
